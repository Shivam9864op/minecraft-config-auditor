<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Minecraft Configuration Auditor personal open-source demo</title>
  <desc id="desc">A read-only configuration audit with explainable severity-labelled findings.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081414"/><stop offset="1" stop-color="#142c2a"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><g opacity=".14" stroke="#34d399" fill="none"><path d="M0 80h1600M0 820h1600M40 0v900M1560 0v900" stroke-dasharray="10 18"/></g>
  <text x="90" y="105" fill="#f1fff9" font-family="Arial, sans-serif" font-size="60" font-weight="700">Minecraft Configuration Auditor</text>
  <text x="93" y="153" fill="#a8c8bd" font-family="Arial, sans-serif" font-size="27">A read-only, explainable review of server configuration files</text>
  <g transform="translate(90 220)" filter="url(#shadow)">
    <rect width="420" height="480" rx="18" fill="#102420" stroke="#1fa676" stroke-width="2"/><text x="32" y="55" fill="#4ade80" font-family="Arial" font-size="23" font-weight="700">CONFIGURATION FILE</text><text x="32" y="88" fill="#a8c8bd" font-family="Arial" font-size="21">server.properties • synthetic fixture</text><path d="M32 120h350" stroke="#1b5f4a"/>
    <g font-family="Consolas, monospace" font-size="21"><text x="32" y="170" fill="#78998d">04</text><text x="75" y="170" fill="#d7f5e6">server-port=</text><text x="230" y="170" fill="#4ade80">25565</text><text x="32" y="207" fill="#78998d">05</text><text x="75" y="207" fill="#d7f5e6">online-mode=</text><text x="230" y="207" fill="#fbbf24">true</text><text x="32" y="244" fill="#78998d">06</text><text x="75" y="244" fill="#d7f5e6">whitelist=</text><text x="230" y="244" fill="#f87171">false</text><text x="32" y="281" fill="#78998d">07</text><text x="75" y="281" fill="#d7f5e6">max-players=</text><text x="230" y="281" fill="#4ade80">20</text><text x="32" y="318" fill="#78998d">08</text><text x="75" y="318" fill="#d7f5e6">view-distance=</text><text x="255" y="318" fill="#4ade80">12</text><text x="32" y="355" fill="#78998d">09</text><text x="75" y="355" fill="#d7f5e6">rcon.password=</text><text x="255" y="355" fill="#f87171">CHANGE_ME</text></g>
    <rect x="32" y="395" width="350" height="54" rx="10" fill="#17382d"/><text x="207" y="429" text-anchor="middle" fill="#8df4ba" font-family="Arial" font-size="20">No writes • no network • no credentials</text>
    <g transform="translate(578)"><rect width="490" height="480" rx="18" fill="#102420" stroke="#1fa676" stroke-width="2"/><text x="32" y="55" fill="#4ade80" font-family="Arial" font-size="23" font-weight="700">AUDIT CHECKLIST</text><text x="32" y="88" fill="#a8c8bd" font-family="Arial" font-size="21">Deterministic evidence + remediation</text><path d="M32 120h425" stroke="#1b5f4a"/><g font-family="Arial" font-size="22"><circle cx="49" cy="165" r="13" fill="#f87171"/><text x="78" y="173" fill="#e8fff2">Authentication</text><text x="350" y="173" fill="#f87171" font-size="18">CRITICAL</text><circle cx="49" cy="230" r="13" fill="#fbbf24"/><text x="78" y="238" fill="#e8fff2">Whitelist exposure</text><text x="350" y="238" fill="#fbbf24" font-size="18">WARNING</text><circle cx="49" cy="295" r="13" fill="#4ade80"/><text x="78" y="303" fill="#e8fff2">Distance limits</text><text x="350" y="303" fill="#4ade80" font-size="18">INFO</text><circle cx="49" cy="360" r="13" fill="#4ade80"/><text x="78" y="368" fill="#e8fff2">Source line evidence</text><text x="350" y="368" fill="#4ade80" font-size="18">INFO</text></g><rect x="32" y="400" width="425" height="54" rx="10" fill="#17382d"/><text x="245" y="434" text-anchor="middle" fill="#8df4ba" font-family="Arial" font-size="20">Read-only review • fails closed</text></g>
    <g transform="translate(1116)"><rect width="310" height="480" rx="18" fill="#102420" stroke="#1fa676" stroke-width="2"/><text x="32" y="55" fill="#4ade80" font-family="Arial" font-size="23" font-weight="700">SEVERITY</text><text x="32" y="88" fill="#a8c8bd" font-family="Arial" font-size="21">Summary of findings</text><path d="M32 120h245" stroke="#1b5f4a"/><rect x="32" y="155" width="245" height="74" rx="12" fill="#3a1d24" stroke="#f87171"/><text x="54" y="202" fill="#fca5a5" font-family="Arial" font-size="23" font-weight="700">CRITICAL</text><rect x="32" y="255" width="245" height="74" rx="12" fill="#3c3215" stroke="#fbbf24"/><text x="54" y="302" fill="#fde68a" font-family="Arial" font-size="23" font-weight="700">WARNING</text><rect x="32" y="355" width="245" height="74" rx="12" fill="#14362a" stroke="#4ade80"/><text x="54" y="402" fill="#86efac" font-family="Arial" font-size="23" font-weight="700">INFO</text></g>
  </g>
  <rect x="390" y="775" width="820" height="45" rx="22" fill="#17382d" stroke="#1fa676"/><text x="800" y="805" text-anchor="middle" fill="#c7f7dd" font-family="Arial" font-size="20">Personal open-source demo • synthetic fixtures • read-only audit</text>
</svg>
